<a class="card" href="{{ url_for('pelicula', movie_id=p.id) }}">
  {% if p.poster_url %}<img src="{{ p.poster_url | poster }}" alt="{{ p.title }}">
  {% else %}<div class="noposter" style="--h:{{ (p.id * 47) % 360 }}"><span>{{ p.title }}</span><small>{{ p.release_year }}</small></div>{% endif %}
  <div class="info">
    <h3>{{ p.title }}</h3>
    <span class="score">⭐ {{ p.rating }}</span>
    <small>{{ p.generos }}</small>
    <p>{{ p.overview[:110] }}…</p>
  </div>
</a>
