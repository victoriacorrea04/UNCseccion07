{% extends "base.html" %}
{% block content %}
<article class="detail">
  {% if p.poster_url %}<img src="{{ p.poster_url | poster }}" alt="{{ p.title }}">{% else %}<div class="noposter big" style="--h:{{ (p.id * 47) % 360 }}"><span>{{ p.title }}</span><small>{{ p.release_year }}</small></div>{% endif %}
  <div>
    <h2>{{ p.title }} <small>({{ p.release_year }})</small></h2>
    <p class="score">⭐ {{ p.rating }} / 10</p>
    <p><strong>Géneros:</strong> {{ p.generos }}</p>
    <p>{{ p.overview }}</p>
    <a href="{{ url_for('index') }}">← Volver al catálogo</a>
  </div>
</article>
{% endblock %}
